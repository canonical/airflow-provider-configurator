name: Tests

on:
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo snap install astral-uv --classic
          sudo snap install just --classic

      - name: Run lint
        run: just lint

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo snap install astral-uv --classic
          sudo snap install just --classic

      - name: Run unit tests
        run: just unit

  build-charm:
    name: Build charm
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Use the official action rather than installing LXD by hand: it
      # provisions LXD in a way that works on GitHub runners, where Docker's
      # iptables rules otherwise block the LXD bridge and `apt-get update`
      # fails inside the build container.
      - name: Pack charm
        uses: canonical/craft-actions/charmcraft/pack@v0.1.1
        with:
          channel: 4.x/stable
          verbosity: trace

      # denylist.yaml is the only non-Python file src/ needs at runtime, so it
      # is the one thing a packaging change could silently drop. Without it the
      # charm cannot enforce Layer 2 at all, so catch it here rather than at
      # deploy time.
      - name: Check the denylist ships in the charm
        run: |
          charm=$(ls ./*.charm)
          if ! unzip -l "$charm" | grep -q 'src/denylist.yaml'; then
            echo "::error::src/denylist.yaml is missing from $charm; Layer 2 cannot be enforced"
            exit 1
          fi
          echo "src/denylist.yaml is present in $charm"

      - name: Upload charm artifact
        uses: actions/upload-artifact@v7
        with:
          name: charm-amd64
          path: ./*.charm
          if-no-files-found: error

  build-lib:
    name: Build interface library
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        run: sudo snap install astral-uv --classic

      # The library is published to PyPI from lib/ by publish-lib.yaml. Build it
      # on every PR so a broken sdist/wheel is caught before the release tag.
      - name: Build sdist and wheel
        working-directory: lib
        run: uv build --out-dir dist

      - name: Upload library artifact
        uses: actions/upload-artifact@v7
        with:
          name: charmlib-dist
          path: lib/dist/
          if-no-files-found: error
