name: Tests

on:
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo snap install astral-uv --classic
          sudo snap install just --classic

      - name: Run lint
        run: just lint

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo snap install astral-uv --classic
          sudo snap install just --classic

      - name: Run unit tests
        run: just unit

  build-charm:
    name: Build charm
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install charmcraft
        run: |
          sudo snap install lxd
          sudo lxd init --auto
          sudo snap install charmcraft --channel 4.x/stable --classic

      - name: Pack charm
        run: sudo charmcraft pack --verbosity trace

      - name: Upload charm artifact
        uses: actions/upload-artifact@v7
        with:
          name: charm-amd64
          path: ./*.charm
          if-no-files-found: error

  build-lib:
    name: Build interface library
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        run: sudo snap install astral-uv --classic

      # The library is published to PyPI from lib/ by publish-lib.yaml. Build it
      # on every PR so a broken sdist/wheel is caught before the release tag.
      - name: Build sdist and wheel
        working-directory: lib
        run: uv build --out-dir dist

      - name: Upload library artifact
        uses: actions/upload-artifact@v7
        with:
          name: charmlib-dist
          path: lib/dist/
          if-no-files-found: error
