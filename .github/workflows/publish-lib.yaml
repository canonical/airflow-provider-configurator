name: Publish charmlib

# Releases the interface library that lives in lib/ (package name
# `airflow-provider-configurator-charmlib`).
#
# Two paths, mirroring canonical/object-storage-integrator:
#   * Push to track/** -> a `.devN` version is published to Test PyPI, so that
#     consumers (e.g. airflow-coordinator) can install a real, immutable
#     artifact instead of pinning a git branch.
#   * Tag `lib/v*`     -> the release is published to PyPI.
#
# How to cut a release:
#   1. Bump `version` in lib/pyproject.toml, e.g. to 0.2.0, and merge it.
#   2. Tag that commit `lib/v0.2.0` and push the tag.
# The release job refuses to publish if the tag and the version disagree.

# No `paths` filter here on purpose: it would also be applied to the `lib/v*`
# tag pushes, where there are no changed files to match against, and a release
# would silently never start.
on:
  push:
    branches:
      - track/**
    tags:
      - 'lib/v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Only for releases: a push to track/** has already run tests.yaml from its
  # own trigger, so calling it here too would duplicate every job.
  release-tests:
    name: Release tests
    if: startsWith(github.ref, 'refs/tags/lib/v')
    uses: ./.github/workflows/tests.yaml
    permissions:
      contents: read

  publish-dev-to-test-pypi:
    name: Publish dev version to Test PyPI
    if: >-
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/heads/track/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Needed for trusted publishing, see https://docs.pypi.org/trusted-publishers/
      id-token: write
    environment:
      name: testpypi
      url: https://test.pypi.org/p/airflow-provider-configurator-charmlib
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        run: sudo snap install astral-uv --classic

      - name: Build a PEP 440 dev version
        working-directory: lib
        run: |
          set -euo pipefail
          VERSION=$(uv version | awk '{print $2}')
          # GITHUB_RUN_NUMBER is unique per workflow, which is all PyPI needs to
          # reject a duplicate upload, and it points straight at the run in the
          # Actions tab.
          uv version "${VERSION}.dev${GITHUB_RUN_NUMBER}"
          uv version

      - name: Build sdist and wheel
        working-directory: lib
        run: uv build --out-dir dist

      - name: Publish to Test PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: lib/dist/

  build:
    name: Build and verify release package
    if: startsWith(github.ref, 'refs/tags/lib/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        run: sudo snap install astral-uv --classic

      - name: Check that the tag matches the package version
        working-directory: lib
        run: |
          set -euo pipefail
          VERSION=$(uv version | awk '{print $2}')
          echo "pyproject version: ${VERSION}"
          echo "git tag:           ${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF_NAME}" != "lib/v${VERSION}" ]]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' does not match lib/pyproject.toml version '${VERSION}'."
            exit 1
          fi

      - name: Build sdist and wheel
        working-directory: lib
        run: uv build --out-dir dist

      - name: Store the distribution packages
        uses: actions/upload-artifact@v7
        with:
          name: charmlib-release-dist
          path: lib/dist/
          if-no-files-found: error

  publish-to-pypi:
    name: Publish release to PyPI
    needs:
      - release-tests
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Needed for trusted publishing, see https://docs.pypi.org/trusted-publishers/
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/airflow-provider-configurator-charmlib
    steps:
      - name: Download the distribution packages
        uses: actions/download-artifact@v8
        with:
          name: charmlib-release-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
