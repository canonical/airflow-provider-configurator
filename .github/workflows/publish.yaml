name: Publish charm

on:
  push:
    branches:
      - track/**
    paths-ignore:
      - '**.md'
      - '.github/workflows/promote.yaml'

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    name: Release tests
    uses: ./.github/workflows/tests.yaml
    permissions:
      contents: read

  publish:
    name: 'Publish charm to edge | amd64'
    runs-on: ubuntu-latest
    needs:
      - tests
    permissions:
      contents: write  # Needed to push the release tag.
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Reuse the charm that `tests.yaml` already packed and uploaded, rather
      # than letting upload-charm pack again. Its `destructive-mode` defaults to
      # true, which builds directly on the runner, and `ubuntu-latest` is 24.04
      # while this charm's base is ubuntu@26.04. Publishing the tested artifact
      # also avoids building the charm twice.
      - name: Download charm artifact
        uses: actions/download-artifact@v8
        with:
          name: charm-amd64
          path: built-charm

      - name: Locate the charm file
        id: charm
        run: |
          set -euo pipefail
          CHARM=$(find built-charm -maxdepth 1 -name '*.charm' | head -n1)
          if [[ -z "${CHARM}" ]]; then
            echo "::error::No .charm file found in the downloaded artifact."
            exit 1
          fi
          echo "path=${CHARM}" >> "$GITHUB_OUTPUT"

      - name: Upload charm package
        uses: canonical/charming-actions/upload-charm@2.7.0
        with:
          credentials: ${{ secrets.CHARMHUB_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          channel: 1.0/edge
          tag-prefix: airflow-provider-configurator
          built-charm-path: ${{ steps.charm.outputs.path }}
