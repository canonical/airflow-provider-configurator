# This file configures Charmcraft.
# See https://documentation.ubuntu.com/charmcraft/stable/reference/files/charmcraft-yaml-file/
type: charm
name: airflow-provider-configurator
title: Airflow Provider Configurator
summary: A charm to configure Airflow providers for Charmed Airflow.
description: |
  A charm that lets Charmed Airflow operators configure Airflow providers
  (connection parameters, credentials, feature flags) without manually editing
  airflow.cfg.

  Non-sensitive provider configuration is sourced from a git repository via the
  git-integrator charm; sensitive configuration is supplied through a Juju user
  secret. The charm relates to the Airflow Coordinator charm to make this
  configuration available for merging into the deployed Airflow's airflow.cfg.

links:
  contact: Workflows Team <workflows-charmers@canonical.com>
  issues:
    - https://github.com/canonical/airflow-provider-configurator/issues
  source:
    - https://github.com/canonical/airflow-provider-configurator

# Documentation:
# https://documentation.ubuntu.com/charmcraft/stable/howto/build-guides/select-platforms/
base: ubuntu@26.04
platforms:
  amd64:

assumes:
  - juju >= 3.6
  - k8s-api

containers:
  git-sync:
    resource: git-sync-image
    mounts:
      - storage: content-from-git
        location: /git

resources:
  git-sync-image:
    type: oci-image
    description: OCI image for git-sync.
    upstream-source: ubuntu/git-sync@sha256:c697bed78c0e2fbb9ef274cc4be693d74da27327a7158625a3cd2d39dd9437e2  # renovate: oci-image tag: 4.7-26.04_edge

storage:
  content-from-git:
    type: filesystem
    description: >
      Where to store the checked-out provider configuration content from the git
      repository.

provides:
  airflow-provider-configuration:
    interface: airflow_provider_configuration

requires:
  remote-airflow-provider-configurations:
    interface: git
    limit: 1
    optional: false

peers:
  replicas:
    interface: airflow_provider_configurator_replica

config:
  options:
    airflow_provider_configurations_secret:
      type: secret
      description: |
        A Juju secret that contains a JSON string under the key
        `airflow_provider_configurations`, a map of provider name to a nested
        section/option map of sensitive config values, e.g.:
        {"provider": {"section": {"option": "secret-value"}}}
        The provider-name nesting is for the admin's authoring convenience; the
        charm flattens it (drops the provider key, keeps the nested
        section/option/value structure).
    airflow_provider_configurations_file_path:
      type: string
      description: |
        (Required) Path to the .ini file containing non-sensitive provider
        configuration, relative to the root of the git repository.
    airflow_provider_configurations_sync_period:
      type: string
      default: "60s"
      description: |
        Poll interval passed to git-sync's --period flag for the continuous sync.

parts:
  charm:
    plugin: uv
    source: .
    build-snaps:
      - astral-uv
  files:
    plugin: dump
    source: .
    stage:
      - LICENSE