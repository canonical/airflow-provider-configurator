[project]
name = "airflow-provider-configurator-charmlib"
version = "0.1.0"
description = "Common charm lib for the provider and requirer of the airflow_provider_configuration relation interface."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "ops>=3,<4",
    "pydantic>=2",
]

[project.urls]
source = "https://github.com/canonical/airflow-provider-configurator/tree/main/lib"

[dependency-groups]
format = [
    "ruff",
]
lint = [
    "ruff",
    "codespell",
]

[tool.ruff]
line-length = 99
extend-exclude = ["__pycache__", "*.egg_info"]
target-version = "py312"
src = ["airflow_provider_configurator"]

[tool.ruff.lint]
select = ["E", "W", "F", "C", "N", "D", "I001"]
extend-ignore = [
    "D203",
    "D204",
    "D213",
    "D215",
    "D400",
    "D401",
    "D404",
    "D406",
    "D407",
    "D408",
    "D409",
    "D413",
]
ignore = ["E501", "D107"]
per-file-ignores = { "__init__.py" = ["D104"] }
mccabe.max-complexity = 10

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["airflow_provider_configurator"]